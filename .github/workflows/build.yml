name: Unzip, Build APK and Release

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: |
          ZIP=$(ls *.zip | head -n 1)
          echo "Using zip: $ZIP"
          mkdir -p /tmp/project
          unzip -q "$ZIP" -d /tmp/project
          # agar zip ke andar ek extra folder hai to usko handle karo
          PKG=$(find /tmp/project -maxdepth 3 -name package.json -not -path "*/node_modules/*" | head -n 1)
          DIR=$(dirname "$PKG")
          echo "Project dir: $DIR"
          mkdir -p /tmp/app
          cp -a "$DIR"/. /tmp/app/

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        working-directory: /tmp/app
        run: npm install --no-audit --no-fund

      - name: Build web
        working-directory: /tmp/app
        run: npm run build

      - name: Add Android platform
        working-directory: /tmp/app
        run: npx cap add android

      - name: Sync web build into Android
        working-directory: /tmp/app
        run: npx cap sync android

      - name: Build debug APK
        working-directory: /tmp/app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: cp /tmp/app/android/app/build/outputs/apk/debug/app-debug.apk ChickenRoad-GoldenRun.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Chicken Road Golden Run v${{ github.run_number }}
          files: ChickenRoad-GoldenRun.apk
